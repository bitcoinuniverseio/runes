name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, universe]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      - name: Build Astro Site
        run: npx astro build

      - name: Generate Markdown Mirrors
        run: node scripts/generate-markdown-mirrors.mjs

      - name: Build Offline Bundle
        run: node scripts/build-offline-pack.mjs

      - name: Publish to the gh-pages branch
        # Branch publishing keeps the site out of Actions artifact storage,
        # which the Free plan shares with private packages and is full.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -qf "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
